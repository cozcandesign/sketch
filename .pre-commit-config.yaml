# Kurulum: cd backend && uv run pre-commit install --config ../.pre-commit-config.yaml
# (ya da depo kökünde `uv run --project backend pre-commit install`)
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd backend && uv run ruff check src tests alembic'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        entry: bash -c 'cd backend && uv run ruff format --check src tests alembic'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy --strict
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npx eslint .'
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
        pass_filenames: false
      - id: prettier
        name: prettier --check
        entry: bash -c 'cd frontend && npx prettier --check src'
        language: system
        files: ^frontend/.*\.(ts|tsx|css)$
        pass_filenames: false
