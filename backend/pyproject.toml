[project]
name = "marketpulse"
version = "0.1.0"
description = "Personal crypto market analysis: direction probabilities with confidence, rationale and accuracy tracking. No trading."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20",
    "greenlet>=3",
    "alembic>=1.13",
    "httpx>=0.27",
    "websockets>=13",
    "pandas>=2.2",
    "numpy>=2.0",
    "loguru>=0.7",
    "anthropic",
    "feedparser>=6.0",
    "yfinance>=0.2.40",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "hypothesis>=6",
    "time-machine>=2.15",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-PyYAML",
    "honcho>=2",
    "pre-commit>=3",
    "import-linter>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketpulse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "ASYNC", "T20", "DTZ", "N", "SIM", "RUF", "PL", "PT", "RET", "C4",
]
ignore = [
    "PLR0913", # too many arguments: pydantic models and constructors
    "PLR2004", # magic values: thresholds are documented in ARCHITECTURE.md
    "RUF001", "RUF002", "RUF003", # ambiguous unicode: Turkish text in strings/comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR2004"]
"alembic/versions/**" = ["E501", "I001", "W291", "Q000"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["marketpulse"]

[[tool.mypy.overrides]]
module = ["feedparser.*", "yfinance.*", "honcho.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["marketpulse"]

[tool.importlinter]
root_package = "marketpulse"

[[tool.importlinter.contracts]]
name = "signals are pure: no storage, network, llm, api or engine imports"
type = "forbidden"
source_modules = ["marketpulse.signals"]
forbidden_modules = [
    "marketpulse.storage",
    "marketpulse.collectors",
    "marketpulse.llm",
    "marketpulse.api",
    "marketpulse.engine",
]

[[tool.importlinter.contracts]]
name = "features depend only on storage and core"
type = "forbidden"
source_modules = ["marketpulse.features"]
forbidden_modules = [
    "marketpulse.signals",
    "marketpulse.ensemble",
    "marketpulse.collectors",
    "marketpulse.llm",
    "marketpulse.api",
    "marketpulse.engine",
]
