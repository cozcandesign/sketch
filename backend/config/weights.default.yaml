# Ufuk bazlı varsayılan modül ağırlıkları (ARCHITECTURE.md §9.1).
#
# Bu dosya yalnızca BAŞLANGIÇ değerleridir. Canlı ağırlıklar `weights` tablosundan okunur; tablo
# boşsa buradaki değerlerle tohumlanır. Ağırlık değişikliği K3 gereği otomatik yapılmaz: sistem
# öneri üretir, kullanıcı arayüzden onaylar.
#
# Faz 2'de yalnızca `technical` modülü veri üretir; diğerleri coverage=0 döner ve ağırlıkları
# çalışan modüllere yeniden dağıtılır (ARCHITECTURE.md §9.2). Yani bugün technical fiilen 1.0'dır.
