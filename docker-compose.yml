# docker compose up --build → engine + api + frontend (ARCHITECTURE.md §19)
# Önce: cp .env.example .env
services:
  api:
    build: ./backend
    command: ["uvicorn", "marketpulse.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      MP_DATA_DIR: /app/data
      MP_DB_URL: sqlite+aiosqlite:////app/data/marketpulse.db
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  engine:
    build: ./backend
    command: ["python", "-m", "marketpulse.engine"]
    env_file: .env
    environment:
      MP_DATA_DIR: /app/data
      MP_DB_URL: sqlite+aiosqlite:////app/data/marketpulse.db
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
